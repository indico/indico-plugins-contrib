[project]
name = 'indico-plugin-my-registrations'
description = 'User profile dashboard listing past and upcoming event registrations'
readme = 'README.md'
version = '3.3-dev'
license = 'MIT'
authors = [
    { name = 'Indico Team', email = 'indico-team@cern.ch' },
    { name = 'José Molina', email = 'jose.molina@unconventional.dev' },
]
classifiers = [
    'Environment :: Plugins',
    'Environment :: Web Environment',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.12',
]
requires-python = '>=3.12.2, <3.13'
dependencies = ['indico>=3.3']

[project.urls]
GitHub = 'https://github.com/indico/indico-plugins-contrib'

[project.entry-points.'indico.plugins']
my_registrations = 'indico_my_registrations.plugin:MyRegistrationsPlugin'

[build-system]
requires = ['hatchling==1.29.0']
build-backend = 'hatchling.build'

[tool.hatch.build]
packages = ['indico_my_registrations']
exclude = [
    '*.no-header',
    '.keep',
    # exclude original client sources (they are all included in source maps anyway)
    'indico_*/client/',
    # no need for tests outside development
    'test_snapshots/',
    'tests/',
    '*_test.py',
]
artifacts = [
    'indico_*/translations/**/messages-react.json',
    'indico_*/translations/**/*.mo',
    'indico_*/static/dist/',
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = '../hatch_build.py'
dependencies = ['babel==2.18.0']
